<h1>Photo Vault - 写真保管庫 サポート</h1>
<p>見られたくない写真や動画を、PIN と Face ID でロックして端末内に保管するアプリです。</p>

<h2>使い方</h2>
<p>1. 初回起動でパスコード（PIN）を作成します。<br>
2. 「写真を追加」から、保管したい写真・動画を取り込みます。<br>
3. 取り込み完了後、元の写真をカメラロールから削除するかどうかを選べます（保管庫にはコピーが残ります）。</p>

<h2>ご注意</h2>
<p>パスコードを忘れると、保管庫を開くことはできません。パスコードの再発行はできませんので、忘れないようご注意ください。</p>
